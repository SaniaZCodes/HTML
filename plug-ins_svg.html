<!DOCTYPE html>
<html lang="en-us">
    <head>
        <title>The Assets & Graphics Lab</title>
        <style>
            body {font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;background-color: #0f172a; color: #f8fafc;padding: 50px;line-height: 1.6;}
            div {background: #1e293b;margin-bottom: 25px;padding: 25px;border-radius: 15px;border-left: 5px solid #3b82f6; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);}
            h2 {color: #60a5fa;margin-top: 0;text-transform: uppercase;letter-spacing: 1px;}
            table {width: 100%;border-collapse: collapse; margin-top: 15px;}
            th, td {padding: 12px;text-align: left;border-bottom: 1px solid #334155;}
            th {background-color: #334155;color: #3b82f6;}
            tr:hover {background-color: #2d3748;}
            svg {display: block;margin: 20px 0;background: #0f172a;border-radius: 8px;padding: 10px;}
        </style>
    </head>
    <body>
        <div>
            <h2>External Document Viewer</h2>
            <embed width="100%"  height="300px" src="https://www.w3schools.com/html/pic_trulli.jpg">
        </div>
        <div>
            <h2>Scalable Graphics</h2>
            <svg width="100%" height="100%">
                <circle cx="50" cy="50" r="40" stroke="white" stroke-width="3" fill="#3498db" />
                <rect width="100" height="100" x="120" y="0" fill="red" />
            </svg>
        </div>
        <div>
            <h2>The Comparison Table</h2>
            <table>
                <tr>
                    <th>Media Type</th>
                    <th>Tag</th>
                    <th>Scalable?</th>
                </tr>
                <tr>
                    <td>Video</td>
                    <td>&lt;video&gt;</td>
                    <td>No</td>
                </tr>
                <tr>
                    <td>Image</td>
                    <td>&lt;img&gt;</td>
                    <td>No</td>
                </tr>
                <tr>
                    <td>Graphic</td>
                    <td>&lt;svg&gt; </td>
                    <td>Yes</td>
                </tr>
            </table>
        </div>
    </body>
</html>
